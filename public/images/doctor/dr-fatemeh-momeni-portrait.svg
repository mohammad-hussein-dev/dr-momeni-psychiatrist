<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142834" />
      <stop offset="45%" stop-color="#1E4D5B" />
      <stop offset="80%" stop-color="#0F202B" />
      <stop offset="100%" stop-color="#09141B" />
    </linearGradient>
    
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26b2c4" />
      <stop offset="100%" stop-color="#1e6b7e" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="scarfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e6b7e" />
      <stop offset="100%" stop-color="#0f3d48" />
    </linearGradient>

    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE7D6" />
      <stop offset="100%" stop-color="#E9BF9E" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" fill="url(#bgGradient)" rx="24" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="220" r="180" fill="#26b2c4" opacity="0.18" filter="url(#softGlow)" />
  <circle cx="650" cy="380" r="220" fill="#0ea5e9" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="400" cy="850" r="260" fill="#1e6b7e" opacity="0.25" filter="url(#softGlow)" />

  <!-- Subtle Neural & Brain Geometric Circuits in Background -->
  <g opacity="0.16" stroke="#88c9d3" stroke-width="1.5" fill="none">
    <circle cx="400" cy="340" r="280" stroke-dasharray="6 8" />
    <circle cx="400" cy="340" r="340" stroke-dasharray="12 12" />
    <path d="M120,400 Q400,200 680,400" />
    <path d="M100,500 Q400,320 700,500" />
    <!-- Neural Nodes -->
    <circle cx="280" cy="220" r="4" fill="#88c9d3" />
    <circle cx="520" cy="220" r="4" fill="#88c9d3" />
    <circle cx="340" cy="160" r="3" fill="#88c9d3" />
    <circle cx="460" cy="160" r="3" fill="#88c9d3" />
    <circle cx="220" cy="320" r="4" fill="#88c9d3" />
    <circle cx="580" cy="320" r="4" fill="#88c9d3" />
    <line x1="280" y1="220" x2="340" y2="160" />
    <line x1="520" y1="220" x2="460" y2="160" />
    <line x1="340" y1="160" x2="460" y2="160" />
  </g>

  <!-- Doctor Silhouette & Illustrated Figure -->
  <g id="DoctorFigure" transform="translate(0, 40)">
    
    <!-- Outer Aura Halo -->
    <ellipse cx="400" cy="380" rx="190" ry="240" fill="#26b2c4" opacity="0.08" filter="url(#softGlow)" />

    <!-- Medical White Coat / Shoulders -->
    <path d="M180,880 L220,540 Q290,490 400,490 Q510,490 580,540 L620,880 Z" fill="url(#coatGrad)" filter="url(#cardShadow)" />
    
    <!-- Inner Dark Teal Clinical Attire -->
    <path d="M320,530 L400,720 L480,530 Q440,510 400,510 Q360,510 320,530 Z" fill="url(#scarfGrad)" />

    <!-- Stethoscope -->
    <path d="M310,540 Q330,680 390,750 Q400,760 410,750 Q470,680 490,540" fill="none" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" />
    <circle cx="400" cy="770" r="16" fill="#64748B" stroke="#CBD5E1" stroke-width="4" />
    <circle cx="400" cy="770" r="7" fill="#0EA5E9" />

    <!-- Elegant Scarf / Hijab Drape -->
    <path d="M280,360 C270,460 300,540 340,560 C370,575 430,575 460,560 C500,540 530,460 520,360 C515,250 480,180 400,180 C320,180 285,250 280,360 Z" fill="url(#scarfGrad)" />

    <!-- Face Oval -->
    <ellipse cx="400" cy="345" rx="85" ry="110" fill="url(#skinGrad)" />

    <!-- Gentle Facial Features (Minimalist Dignified Clinical Art) -->
    <!-- Eyes -->
    <path d="M350,335 Q365,325 380,335" fill="none" stroke="#2C3335" stroke-width="3" stroke-linecap="round" />
    <circle cx="365" cy="340" r="4.5" fill="#1E293B" />
    
    <path d="M420,335 Q435,325 450,335" fill="none" stroke="#2C3335" stroke-width="3" stroke-linecap="round" />
    <circle cx="435" cy="340" r="4.5" fill="#1E293B" />

    <!-- Eyebrows -->
    <path d="M345,318 Q365,310 385,320" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
    <path d="M415,320 Q435,310 455,318" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />

    <!-- Nose line -->
    <path d="M400,330 L396,365 L406,370" fill="none" stroke="#D4A373" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Serene Warm Smile -->
    <path d="M378,398 Q400,412 422,398" fill="none" stroke="#9F2B68" stroke-width="3" stroke-linecap="round" />

    <!-- Eyeglasses (Optional Clinical Precision Rim) -->
    <rect x="338" y="322" width="52" height="34" rx="10" fill="none" stroke="#D97706" stroke-width="2" opacity="0.85" />
    <rect x="410" y="322" width="52" height="34" rx="10" fill="none" stroke="#D97706" stroke-width="2" opacity="0.85" />
    <path d="M390,335 L410,335" fill="none" stroke="#D97706" stroke-width="2" />
  </g>

  <!-- Floating Information Cards / Badges -->
  <!-- 1. Top Certified Badge -->
  <g transform="translate(60, 60)">
    <rect width="250" height="54" rx="27" fill="#0F172A" fill-opacity="0.9" stroke="url(#tealGrad)" stroke-width="2" filter="url(#cardShadow)" />
    <circle cx="32" cy="27" r="16" fill="#1E6B7E" />
    <path d="M26,27 L30,31 L38,22" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="58" y="26" fill="#F8FAFC" font-family="'Vazirmatn', system-ui, sans-serif" font-size="13" font-weight="bold">بورد تخصصی اعصاب و روان</text>
    <text x="58" y="42" fill="#88C9D3" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600">Board Certified Psychiatrist</text>
  </g>

  <!-- 2. Bottom Hospital Card -->
  <g transform="translate(420, 840)">
    <rect width="320" height="84" rx="20" fill="#0F172A" fill-opacity="0.92" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />
    <circle cx="48" cy="42" r="24" fill="#26B2C4" fill-opacity="0.15" />
    <!-- Hospital Icon -->
    <path d="M38,34 L58,34 L58,54 L38,54 Z M48,38 L48,50 M42,44 L54,44" fill="none" stroke="#26B2C4" stroke-width="2.5" stroke-linecap="round" />
    <text x="86" y="36" fill="#F8FAFC" font-family="'Vazirmatn', system-ui, sans-serif" font-size="14" font-weight="bold">بیمارستان نیکان غرب تهران</text>
    <text x="86" y="54" fill="#94A3B8" font-family="'Vazirmatn', system-ui, sans-serif" font-size="11">کد نظام پزشکی: ۱۳۳۴۳۹</text>
    <text x="86" y="70" fill="#F59E0B" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600">Nikan Gharb Hospital • Tehran</text>
  </g>

  <!-- 3. Bottom Left Doctor Name Plate -->
  <g transform="translate(60, 840)">
    <rect width="330" height="84" rx="20" fill="url(#tealGrad)" filter="url(#cardShadow)" />
    <text x="24" y="36" fill="#FFFFFF" font-family="'Vazirmatn', system-ui, sans-serif" font-size="18" font-weight="900">دکتر فاطمه مومنی</text>
    <text x="24" y="56" fill="#E0F2FE" font-family="'Vazirmatn', system-ui, sans-serif" font-size="12" font-weight="600">متخصص اعصاب و روان (روانپزشک)</text>
    <text x="24" y="72" fill="#BAE6FD" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10">Dr. Fatemeh Momeni | Adult &amp; Mood Specialist</text>
  </g>
</svg>
