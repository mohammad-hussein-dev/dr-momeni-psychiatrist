<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="roomWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#192834" />
      <stop offset="60%" stop-color="#14222C" />
      <stop offset="100%" stop-color="#0E1820" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D2319" />
      <stop offset="100%" stop-color="#1C140D" />
    </linearGradient>
    <linearGradient id="sofaTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26B2C4" />
      <stop offset="100%" stop-color="#155D6C" />
    </linearGradient>
    <linearGradient id="warmLight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0" />
    </linearGradient>
    <filter id="lampGlow">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Room Architecture -->
  <rect width="1200" height="540" fill="url(#roomWall)" />
  <rect y="540" width="1200" height="260" fill="url(#floorGrad)" />
  <line x1="0" y1="540" x2="1200" y2="540" stroke="#453324" stroke-width="6" />

  <!-- Warm Clinical Lamp Light Cone -->
  <polygon points="200,80 80,540 360,540" fill="url(#warmLight)" />
  
  <!-- Floor Lamp -->
  <circle cx="200" cy="80" r="28" fill="#FBBF24" opacity="0.6" filter="url(#lampGlow)" />
  <path d="M170,80 L230,80 L215,140 L185,140 Z" fill="#D97706" />
  <line x1="200" y1="140" x2="200" y2="540" stroke="#78350F" stroke-width="5" />
  <ellipse cx="200" cy="540" rx="35" ry="10" fill="#451A03" />

  <!-- Calming Therapy Art Frame on Wall -->
  <rect x="420" y="100" width="360" height="220" rx="8" fill="#0F172A" stroke="#475569" stroke-width="8" />
  <!-- Abstract Wave Artwork inside Frame -->
  <g transform="translate(430, 110)">
    <rect width="340" height="200" fill="#0B131B" />
    <circle cx="170" cy="100" r="60" fill="#0284C7" opacity="0.4" />
    <path d="M20,120 Q100,50 170,100 T320,100" fill="none" stroke="#26B2C4" stroke-width="4" />
    <path d="M20,140 Q100,80 170,120 T320,120" fill="none" stroke="#38BDF8" stroke-width="3" />
    <text x="170" y="175" text-anchor="middle" fill="#94A3B8" font-family="'Vazirmatn', sans-serif" font-size="11">کلینیک تخصصی روان‌پزشکی و اعصاب و روان</text>
  </g>

  <!-- Doctor & Patient Therapy Chairs -->
  <!-- Left Chair (Doctor) -->
  <g transform="translate(320, 360)">
    <rect x="0" y="40" width="160" height="120" rx="20" fill="url(#sofaTeal)" stroke="#0E4A56" stroke-width="2" />
    <rect x="20" y="0" width="120" height="80" rx="16" fill="#1E6B7E" />
    <rect x="15" y="150" width="12" height="50" rx="4" fill="#334155" />
    <rect x="133" y="150" width="12" height="50" rx="4" fill="#334155" />
  </g>

  <!-- Center Table with Tea & Notepad -->
  <g transform="translate(540, 440)">
    <ellipse cx="60" cy="30" rx="75" ry="24" fill="#78350F" stroke="#92400E" stroke-width="3" />
    <rect x="54" y="50" width="12" height="70" fill="#451A03" />
    <!-- Notepad / Medical Chart -->
    <rect x="25" y="15" width="28" height="20" rx="2" fill="#F8FAFC" transform="rotate(-15 35 25)" />
    <!-- Herbal Tea Cup -->
    <circle cx="85" cy="26" r="8" fill="#F59E0B" />
  </g>

  <!-- Right Recliner / Comfortable Patient Sofa -->
  <g transform="translate(720, 360)">
    <rect x="0" y="40" width="180" height="120" rx="24" fill="#334155" stroke="#1E293B" stroke-width="2" />
    <rect x="20" y="0" width="140" height="80" rx="16" fill="#475569" />
    <!-- Soft Cushion -->
    <ellipse cx="90" cy="75" rx="40" ry="25" fill="#26B2C4" opacity="0.6" />
    <rect x="20" y="150" width="12" height="50" rx="4" fill="#1E293B" />
    <rect x="148" y="150" width="12" height="50" rx="4" fill="#1E293B" />
  </g>

  <!-- Calming Plant (Monstera / Ficus) on Right -->
  <g transform="translate(1020, 320)">
    <path d="M-15,100 L15,100 L25,180 L-25,180 Z" fill="#9A3412" />
    <!-- Foliage Leaves -->
    <circle cx="-30" cy="40" r="35" fill="#047857" opacity="0.9" />
    <circle cx="20" cy="20" r="40" fill="#10B981" opacity="0.9" />
    <circle cx="0" cy="70" r="30" fill="#059669" opacity="0.9" />
  </g>

  <!-- Atmosphere Badge -->
  <g transform="translate(600, 740)" text-anchor="middle">
    <rect x="-260" y="-18" width="520" height="36" rx="18" fill="#0B131B" fill-opacity="0.9" stroke="#26B2C4" stroke-width="1" />
    <text y="5" fill="#38BDF8" font-family="'Vazirmatn', system-ui, sans-serif" font-size="12" font-weight="bold">
      فضای امن، محرمانه و استاندارد درمانی بیمارستان نیکان غرب
    </text>
  </g>
</svg>
