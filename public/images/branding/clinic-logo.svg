<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="logoTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26B2C4" />
      <stop offset="50%" stop-color="#1E6B7E" />
      <stop offset="100%" stop-color="#0F3D48" />
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#26B2C4" />
    </linearGradient>
  </defs>

  <rect width="500" height="500" rx="100" fill="#0B131B" />
  
  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="url(#glowRing)" stroke-width="6" stroke-dasharray="16 10" />
  <circle cx="250" cy="250" r="165" fill="url(#logoTealGrad)" />

  <!-- Brain & Lotus Empathy Symbol -->
  <g transform="translate(250, 240)" text-anchor="middle">
    <!-- Brain Hemisphere Left -->
    <path d="M-10,-50 C-60,-50 -90,-20 -90,20 C-90,50 -60,75 -10,80 Z" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
    <!-- Brain Hemisphere Right -->
    <path d="M10,-50 C60,-50 90,-20 90,20 C90,50 60,75 10,80 Z" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
    
    <!-- Central Serene Heart/Tree Axis -->
    <line x1="0" y1="-60" x2="0" y2="85" stroke="#BAE6FD" stroke-width="5" stroke-linecap="round" />
    
    <!-- Neural Synapse Sparkles -->
    <circle cx="-45" cy="0" r="6" fill="#38BDF8" />
    <circle cx="45" cy="0" r="6" fill="#38BDF8" />
    <circle cx="-30" cy="-25" r="5" fill="#FBBF24" />
    <circle cx="30" cy="-25" r="5" fill="#FBBF24" />
    <circle cx="0" cy="-65" r="8" fill="#FBBF24" />
  </g>

  <!-- Typography Curved/Base -->
  <text x="250" y="380" text-anchor="middle" fill="#FFFFFF" font-family="'Vazirmatn', sans-serif" font-size="20" font-weight="900">
    دکتر فاطمه مومنی
  </text>
  <text x="250" y="405" text-anchor="middle" fill="#BAE6FD" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="2">
    DR. FATEMEH MOMENI
  </text>
</svg>
