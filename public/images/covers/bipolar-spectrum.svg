<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Dual Harmonic Sine Waves representing Mood Equilibrium -->
  <path d="M250,300 Q425,180 600,300 T950,300" fill="none" stroke="url(#wave1)" stroke-width="6" stroke-linecap="round" />
  <path d="M250,300 Q425,420 600,300 T950,300" fill="none" stroke="#a855f7" stroke-width="3" stroke-dasharray="8 6" opacity="0.6" />
  
  <!-- Central Center Anchor Point -->
  <circle cx="600" cy="300" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="3" />

  <rect x="420" y="470" width="360" height="46" rx="23" fill="#1e1b4b" stroke="#ec4899" stroke-width="1.5" />
  <text x="600" y="499" text-anchor="middle" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">
    طیف اختلالات دوقطبی و تثبیت خلق
  </text>
  
  <text x="600" y="550" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">
    Bipolar Spectrum Disorders • Dr. Fatemeh Momeni
  </text>
</svg>
