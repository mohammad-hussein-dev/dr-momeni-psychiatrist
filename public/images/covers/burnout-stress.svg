      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="batteryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Recharging Battery Symbol -->
  <rect x="460" y="240" width="280" height="130" rx="20" fill="none" stroke="#78716c" stroke-width="6" />
  <rect x="744" y="280" width="16" height="50" rx="8" fill="#78716c" />

  <!-- Charging Bars -->
  <rect x="480" y="260" width="60" height="90" rx="8" fill="#ef4444" opacity="0.9" />
  <rect x="550" y="260" width="60" height="90" rx="8" fill="#f97316" opacity="0.9" />
  <rect x="620" y="260" width="60" height="90" rx="8" fill="#22c55e" opacity="0.9" />

  <rect x="420" y="470" width="360" height="46" rx="23" fill="#1c1917" stroke="#f97316" stroke-width="1.5" />
  <text x="600" y="499" text-anchor="middle" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">
