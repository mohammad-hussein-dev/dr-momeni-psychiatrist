<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Caduceus / Medical Cross / Brain Icon -->
  <circle cx="600" cy="290" r="120" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10 6" opacity="0.4" />
  
  <!-- Medical Cross with Rounded Corners -->
  <rect x="580" y="210" width="40" height="160" rx="12" fill="url(#shieldGrad)" />
  <rect x="520" y="270" width="160" height="40" rx="12" fill="url(#shieldGrad)" />

  <circle cx="600" cy="290" r="28" fill="#ffffff" />
  <path d="M592,290 L598,296 L610,284" stroke="#0284c7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <rect x="420" y="470" width="360" height="46" rx="23" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="600" y="499" text-anchor="middle" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">
    مفاهیم پایه روان‌پزشکی و دارودرمانی نوین
  </text>
  
  <text x="600" y="550" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">
    Foundational Psychiatry &amp; Clinical Sciences • Dr. Fatemeh Momeni
  </text>
</svg>
