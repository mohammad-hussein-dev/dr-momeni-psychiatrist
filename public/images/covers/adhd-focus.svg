<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="focusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Target & Focus rings -->
  <circle cx="600" cy="300" r="170" fill="none" stroke="#71717a" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.4" />
  <circle cx="600" cy="300" r="120" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 4" opacity="0.6" />
  <circle cx="600" cy="300" r="70" fill="none" stroke="#ec4899" stroke-width="3" opacity="0.8" />
  <circle cx="600" cy="300" r="24" fill="url(#focusGrad)" />

  <!-- Dynamic energy arrows converging into center -->
  <path d="M420,300 L540,300 M780,300 L660,300 M600,120 L600,240 M600,480 L600,360" 
        stroke="url(#focusGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- ADHD / Focus Title -->
  <rect x="420" y="470" width="360" height="46" rx="23" fill="#18181b" stroke="#a855f7" stroke-width="1.5" />
  <text x="600" y="499" text-anchor="middle" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">
    بیش‌فعالی بزرگسالان (ADHD) و ارتقای تمرکز
  </text>
  
  <text x="600" y="550" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="14">
    Adult ADHD &amp; Executive Function • Dr. Fatemeh Momeni
  </text>
</svg>
