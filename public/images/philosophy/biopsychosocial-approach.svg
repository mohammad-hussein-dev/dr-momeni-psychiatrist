<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgAppro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1722" />
      <stop offset="60%" stop-color="#142433" />
      <stop offset="100%" stop-color="#0a1017" />
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26b2c4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glowFlow">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgAppro)" rx="20" />

  <!-- 4 Step Clinical Care Flow -->
  <g transform="translate(600, 60)" text-anchor="middle">
    <text y="20" fill="#38BDF8" font-family="'Vazirmatn', system-ui, sans-serif" font-size="14" font-weight="bold">مسیر بالینی درمان استاندارد</text>
    <text y="50" fill="#F8FAFC" font-family="'Vazirmatn', system-ui, sans-serif" font-size="24" font-weight="800">رویکرد مرحله‌به‌مرحله و شخصی‌سازی‌شده مراجعین</text>
  </g>

  <!-- Flow connecting horizontal line -->
  <path d="M180,310 L1020,310" stroke="url(#flowGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8" opacity="0.6" filter="url(#glowFlow)" />

  <!-- Step 1: Initial Assessment -->
  <g transform="translate(180, 310)">
    <circle cx="0" cy="0" r="50" fill="#132738" stroke="#26b2c4" stroke-width="3" />
    <text y="6" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="bold">01</text>
    
    <g transform="translate(0, 80)" text-anchor="middle">
      <text y="0" fill="#38BDF8" font-family="'Vazirmatn', system-ui, sans-serif" font-size="15" font-weight="bold">ارزیابی و تریاژ دقیق</text>
      <text y="22" fill="#94A3B8" font-family="'Vazirmatn', system-ui, sans-serif" font-size="11">بررسی تاریخچه، علل جسمی</text>
      <text y="38" fill="#94A3B8" font-family="'Vazirmatn', system-ui, sans-serif" font-size="11">و مصاحبه بالینی استاندارد</text>
    </g>
  </g>

  <!-- Step 2: Formulating Plan -->
  <g transform="translate(460, 310)">
    <circle cx="0" cy="0" r="50" fill="#132738" stroke="#38bdf8" stroke-width="3" />
    <text y="6" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="bold">02</text>
    
    <g transform="translate(0, 80)" text-anchor="middle">
      <text y="0" fill="#38BDF8" font-family="'Vazirmatn', system-ui, sans-serif" font-size="15" font-weight="bold">تدوین نقشه درمان فردی</text>
      <text y="22" fill="#94A3B8" font-family="'Vazirmatn', system-ui, sans-serif" font-size="11">تصمیم‌گیری مشترک با بیمار</text>
      <text y="38" fill="#94A3B8" font-family="'Vazirmatn', system-ui, sans-serif" font-size="11">انتخاب حداقل دوز دارویی مؤثر</text>
    </g>
  </g>

  <!-- Step 3: Combined Therapy -->
  <g transform="translate(740, 310)">
    <circle cx="0" cy="0" r="50" fill="#132738" stroke="#818cf8" stroke-width="3" />
    <text y="6" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="bold">03</text>
    
    <g transform="translate(0, 80)" text-anchor="middle">
      <text y="0" fill="#818CF8" font-family="'Vazirmatn', system-ui, sans-serif" font-size="15" font-weight="bold">درمان هم‌افزا (تلفیقی)</text>
      <text y="22" fill="#94A3B8" font-family="'Vazirmatn', system-ui, sans-serif" font-size="11">همزمانی تنظیم بیوشیمی مغز</text>
      <text y="38" fill="#94A3B8" font-family="'Vazirmatn', system-ui, sans-serif" font-size="11">با جلسات روان‌درمانی و CBT</text>
    </g>
  </g>

  <!-- Step 4: Long-Term Relapse Prevention -->
  <g transform="translate(1020, 310)">
    <circle cx="0" cy="0" r="50" fill="#132738" stroke="#34d399" stroke-width="3" />
    <text y="6" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="bold">04</text>
    
    <g transform="translate(0, 80)" text-anchor="middle">
      <text y="0" fill="#34D399" font-family="'Vazirmatn', system-ui, sans-serif" font-size="15" font-weight="bold">تثبیت و قطع ایمن دارو</text>
      <text y="22" fill="#94A3B8" font-family="'Vazirmatn', system-ui, sans-serif" font-size="11">کاهش تدریجی زیر نظر پزشک</text>
      <text y="38" fill="#94A3B8" font-family="'Vazirmatn', system-ui, sans-serif" font-size="11">و پایش پایداری سلامت روان</text>
    </g>
  </g>

  <!-- Bottom Doctor Badge -->
  <g transform="translate(600, 590)" text-anchor="middle">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#0b1622" stroke="#1f3b4d" stroke-width="1.2" />
    <text y="5" fill="#E2E8F0" font-family="'Vazirmatn', system-ui, sans-serif" font-size="12" font-weight="bold">دکتر فاطمه مومنی | دارای بورد تخصصی اعصاب و روان از دانشگاه علوم پزشکی</text>
  </g>
</svg>
