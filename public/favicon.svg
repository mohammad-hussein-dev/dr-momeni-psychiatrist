<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="favTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26B2C4" />
      <stop offset="60%" stop-color="#1E6B7E" />
      <stop offset="100%" stop-color="#0E4856" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="128" height="128" rx="28" fill="#0B131B" />
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#favTeal)" />

  <!-- Mind / Brain & Neural Synapse Symbol -->
  <g transform="translate(64, 64)" stroke-linecap="round">
    <!-- Left Hemisphere -->
    <path d="M-5,-24 C-26,-24 -38,-10 -38,8 C-38,22 -24,32 -5,35" fill="none" stroke="#FFFFFF" stroke-width="5" />
    <!-- Right Hemisphere -->
    <path d="M5,-24 C26,-24 38,-10 38,8 C38,22 24,32 5,35" fill="none" stroke="#FFFFFF" stroke-width="5" />
    
    <!-- Central Vital Axis -->
    <line x1="0" y1="-30" x2="0" y2="38" stroke="#BAE6FD" stroke-width="4.5" />
    
    <!-- Mind Sparkle Nodes -->
    <circle cx="-18" cy="0" r="3.5" fill="#38BDF8" />
    <circle cx="18" cy="0" r="3.5" fill="#38BDF8" />
    <circle cx="-13" cy="-13" r="3" fill="#FBBF24" />
    <circle cx="13" cy="-13" r="3" fill="#FBBF24" />
    <circle cx="0" cy="-33" r="4" fill="#FBBF24" />
  </g>
</svg>
