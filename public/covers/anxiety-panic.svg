<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  
  <!-- Subtle decorative grid & waves -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.5">
    <path d="M0,337 Q300,200 600,337 T1200,337" fill="none" />
    <path d="M0,380 Q300,240 600,380 T1200,380" fill="none" />
    <path d="M0,290 Q300,160 600,290 T1200,290" fill="none" />
  </g>

  <!-- Calming Aura Circle -->
  <circle cx="600" cy="310" r="160" fill="#0284c7" opacity="0.15" filter="url(#glow)" />
  <circle cx="600" cy="310" r="110" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.6" stroke-dasharray="8 6" />

  <!-- Central ECG & Brainwave calming icon -->
  <path d="M420,310 L500,310 L530,220 L560,390 L590,260 L620,340 L650,290 L680,310 L780,310" 
        fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Badge & Typography -->
  <rect x="440" y="470" width="320" height="46" rx="23" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" opacity="0.9" />
  <text x="600" y="499" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">
    مدیریت اضطراب و مهار پانیک | کلینیک تخصصی
  </text>
  
  <text x="600" y="550" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">
    Dr. Fatemeh Momeni • Board-Certified Psychiatrist
  </text>
</svg>
